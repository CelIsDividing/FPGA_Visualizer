services:
  - type: web
    name: fpga-visualizer-tool
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 8 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MPLBACKEND
        value: Agg
      - key: FLASK_DEBUG
        value: "0"
      - key: HOST
        value: 0.0.0.0
